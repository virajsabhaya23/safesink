name: mcp-conformance
on:
  push:
  pull_request:
  workflow_dispatch:

# Verification executes the server under test, so this workflow never holds a
# writable token. The sticky comment is posted by pr-report.yml from a
# workflow_run event, after this run has finished.
permissions:
  contents: read

concurrency:
  group: mcp-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run SafeSink against the passing MCP fixture
        uses: ./
        with:
          manifest: examples/mcp-conformance/passing.json
          out: out/mcp/report.json
          junit: out/mcp/junit.xml
          sarif: out/mcp/report.sarif
          markdown: out/mcp/report.md
          comment: "false"
      - name: Preserve conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safesink-mcp-conformance
          path: out/mcp/
          if-no-files-found: warn
          retention-days: 14
